<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Registro - ParkingZon</title>
  <link rel="stylesheet" href="css/styles2.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
<header class="header">
  <h1 class="logo"><i class="ri-car-line"></i> ParkingZon</h1>
</header>

<main class="auth-container">
  <div class="auth-switch">
    <a href="login.html" id="btn-login1" class="auth-btn">Acceder</a>
    <button id="btn-register1" class="auth-btn active">Registrar</button>
  </div>

<!--  &lt;!&ndash; Register Options &ndash;&gt;-->

<!--    <button class="option-btn" onclick="showRegisterForm('empresa')">Empresa</button>-->
<!--  </section>-->

  <!-- Register Form Persona -->
  <section id="register-persona" class="form-section">
    <h2>¡Bienvenid@!</h2>

    <label for="name">Nombre y Apellidos</label>
    <input id="name" type="text" placeholder="Ej. Juan Perez">

    <label for="phone">Celular</label>
    <input id="phone" type="tel" placeholder="Ej. 987654321">

    <label for="register-email">Correo Electrónico</label>
    <input id="register-email" type="email" placeholder="Ej. correo@email.com">

    <label for="register-password">Contraseña</label>
    <input id="register-password" type="password" placeholder="Crea una contraseña">

    <div class="terms">
      <input type="checkbox" id="terms">
      <label for="terms">He leído y aceptado los Términos y condiciones.</label>
    </div>

    <button class="submit-btn" onclick="goToVehicleRegistration()">Sign Up</button>
  </section>
</main>
