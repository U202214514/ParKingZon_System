<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParKingZon - Inicio</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <section class="hero">
        <!-- Fondo de imagen -->
        <div class="hero-background">
            <img src="images/pathtoyour-image.jpg" alt="Persona señalando su reserva">
        </div>

        <!-- Contenido -->
        <div class="hero-content">
            <!-- Logo y lema -->
            <h1 class="logo">ParkingZon</h1>
            <p class="slogan">¡Aparcar tu vehículo nunca fue tan fácil!</p>
            
            <!-- Botón de login -->
            <a href="login.html" class="login-btn">Log in</a>

            <!-- Descripción con opción de registro -->
            <p class="register-prompt">¿Aún no estás registrado? <a href="register.html" class="register-link">Regístrate</a></p>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
