<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inicio - ParkingZon</title>
  <link rel="icon" href="icono_parkingzon.png" type="image/png">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-image: url('Landing Page/pathtoyour-image.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
    }

    .menu-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      font-size: 30px;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      z-index: 1001;
    }

    .sidebar-container {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 0;
      background-color: transparent;
      overflow-x: hidden;
      transition: 0.3s;
      z-index: 1000;
    }

    .sidebar {
      width: 250px;
      height: 100%;
      background-color: white;
      padding-top: 20px;
      box-shadow: 2px 0 5px rgba(0,0,0,0.3);
    }

    .sidebar img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 20px;
    }

    .sidebar a {
      padding: 15px 30px;
      text-decoration: none;
      font-size: 16px;
      color: #333;
      display: block;
      border-bottom: 1px solid #ddd;
    }

    .sidebar a:hover {
      background-color: #f0f0f0;
      font-weight: bold;
    }

    .sidebar-container.open {
      width: 250px;
    }

    .header {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 80px;
      color: white;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
    }

    .header img {
      width: 40px;
      height: 40px;
      margin-right: 10px;
    }

    .header h1 {
      font-size: 32px;
      margin: 0;
      color: white;
    }

    .buttons {
      text-align: center;
      margin-top: 50px;
    }

    .buttons button {
      background-color: #ff5733;
      color: white;
      border: none;
      padding: 15px 30px;
      margin: 10px auto;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      width: 80%;
      max-width: 300px;
      display: block;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .buttons button:hover {
      background-color: #e24620;
    }
  </style>
</head>
<body>

  <!-- Botón del menú (hamburguesa) -->
  <button class="menu-toggle" onclick="toggleMenu()">☰</button>

  <!-- Contenedor transparente y menú lateral blanco -->
  <div class="sidebar-container" id="sidebarContainer">
    <div class="sidebar">
      <img src="perfil.jpg" alt="Foto de perfil" />
      <a href="perfil.html">Mi perfil</a>
      <a href="Informaci0n_Estacionamiento.html">Reseñas</a>
      <a href="ajustes.html">Ajustes</a>
      <a href="terminos.html">Términos y condiciones</a>
      <a href="logout.html">Cerrar sesión</a>
    </div>
  </div>

  <!-- Logo y título -->
  <div class="header">
    <img src="icono_parkingzon.png" alt="Icono ParkingZon" />
    <h1>ParkingZon</h1>
  </div>

  <!-- Botones principales -->
  <div class="buttons">
    <button onclick="location.href='buscar_estacionamiento.html'">Buscar estacionamientos</button>
    <button onclick="location.href='Informaci0n_Estacionamiento.html'">Estacionamientos favoritos</button>
    <button onclick="location.href='reserva.html'">Mis reservas</button>
  </div>

  <script>
    function toggleMenu() {
      const sidebar = document.getElementById('sidebarContainer');
      sidebar.classList.toggle('open');
    }
  </script>

</body>
</html>
